[pytest]
# Only tests/ holds tests. Without this, a bare `pytest` from the repo root also
# collects scripts/{e2e,full,chaos}_test.py — those are OPERATOR scripts that
# expect a live server and a SEED_PASSWORD env var, so collection died with
# "NameError: SEED_PASSWORD is not defined" before a single real test ran.
# CLAUDE.md documents the command as plain `pytest`, so this makes the docs true.
testpaths = tests
norecursedirs = scripts .venv node_modules migrations .git

markers =
    production_hashing: run this test with real (slow) Argon2 parameters. Only for
        tests that MEASURE hashing time — see the timing-attack note in conftest.py.

# ── How to run ────────────────────────────────────────────────────────────────
#   pytest                  → everything, serial. Correct but slower (~7 min).
#   pytest -n 4             → fast (~2 min). Auto-SKIPS the production_hashing
#                             tests, because timing assertions are meaningless
#                             under CPU contention (see conftest.py).
#   pytest -m production_hashing
#                           → the 4 skipped timing tests, serial. Run this after
#                             a parallel run, or the enumeration-timing defence
#                             goes unverified.
# CI should run both: `pytest -n 4` then `pytest -m production_hashing`.
